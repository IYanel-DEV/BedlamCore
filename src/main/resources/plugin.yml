name: BedlamCore
version: ${version}
main: dev.iyanel.bedlamcore.BedlamCore
author: Youniss
description: GUI-first Bed Wars game engine for Spigot and Paper.
# Modern (post-Flattening) plugin. Without this, Paper 1.13+/26.x runs BedlamCore in legacy
# material mode, which strips colored ItemStacks (RED_WOOL, etc.) down to white legacy WOOL.
# Ignored by Spigot 1.8.8, so the same jar still runs on the legacy server.
api-version: "1.13"
# Optional soft-depend only for users who also install Citizens: BedlamCore has its own built-in
# Citizens-free packet NPC system (real player-model fake-players with skins + look-at), so Citizens
# is NOT required. When Citizens is the plugin still picks it up for nicer NPC bodies; otherwise the
# built-in packet system handles everything. softdepend keeps load order correct when both are present.
# BungeeParties / PartyAndFriends are optional: when present on this server BedlamCore can prefer them as
# the party provider (config party.provider); absent, the built-in party system is used. Harmless softdepend.
softdepend: [Citizens, BungeeParties, PartyAndFriends]
commands:
  bedlam:
    description: BedlamCore fallback controls.
    usage: /bedlam [menu|solo|doubles|leave|spawnbuild|forcestart|reload|token|xp]
    aliases: [bc]
  leave:
    description: Leave the current BedlamCore game.
    usage: /leave
  rejoin:
    description: Rejoin a match you disconnected from (within the grace window).
    usage: /rejoin
    aliases: [rj]
  party:
    description: Create and manage a BedlamCore party.
    usage: /party [create|invite|accept|deny|kick|promote|leave|disband|list|open|close|warp|chat|help]
    aliases: [p]
  pc:
    description: Send a message to your party (no args toggles party chat).
    usage: /pc <message>
  leaderboard:
    description: View the Bed Wars leaderboards.
    usage: /leaderboard [wins|kills|finalkills|beds|winstreak|kdr|fkdr|level|xp|tokens] [solo|doubles] [page]
    aliases: [lb, top]
permissions:
  bedlam.admin:
    description: Configure and control BedlamCore arenas.
    default: op
    children:
      bedlam.token.add: true
      bedlam.xp.add: true
  bedlam.token.add:
    description: Add tokens to a player via /bc token add.
    default: op
  bedlam.xp.add:
    description: Add XP to a player via /bc xp add.
    default: op
  bedlam.lobby.build:
    description: Break and place blocks in the BedlamCore lobby world.
    default: false
  bedlam.play:
    description: Join BedlamCore games.
    default: true
  bedlam.leaderboard:
    description: View the Bed Wars leaderboards via /leaderboard.
    default: true
  bedlam.party.use:
    description: Use the /party command and party features.
    default: true
  bedlam.party.leader:
    description: Perform party leader actions (invite, kick, promote, disband).
    default: true
  bedlam.party.chat:
    description: Use /pc and party chat.
    default: true
  bedlam.party.bypass-limit:
    description: Create parties larger than party.max-size (staff tools).
    default: op
